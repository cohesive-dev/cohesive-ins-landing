# SEO contractor + restaurant form suites (PR #67, B 2026-10-09 option (a); restaurant short form 2026-10-12): the ops box's portal launch guard refuses these local
# .cjs runs (TS closure / a real browser test), so they run here, off-box, and a green check is the merge proof.
name: seo-contractor-form
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # playwright is not a repo dependency; the suite drives the runner's system Chrome (/usr/bin/google-chrome)
      - run: npm i --no-save playwright@1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Unit - SEO contractor intake (form handlers + /api/intake, all external services stubbed)
        run: node scripts/test-seo-contractor-intake.cjs
      - name: Unit - Spanish contractor form (/es/seguro/techadores + /api/intake, all external services stubbed)
        run: node scripts/test-es-contractor-form.cjs
      - name: Unit - Spanish SEO pages (copy rules, hreflang/sitemap, Spanish restaurant form + /api/intake, externals stubbed)
        run: node scripts/test-es-seo-pages.cjs
      - name: Unit - SEO restaurant short form (RestaurantQuickQuote + /api/intake, all external services stubbed)
        run: node scripts/test-seo-restaurant-short-form.cjs
      - name: Unit - restaurant titles and meta descriptions carry each type's own approved price
        run: node scripts/test-seo-restaurant-snippets.cjs
      - run: npm run build
      - name: Start the built site on :3021
        run: |
          npm run start -- -p 3021 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3021/ > /dev/null && exit 0; sleep 2; done
          cat /tmp/next.log; exit 1
      - name: Browser - contractor partial capture (intake requests are intercepted; nothing real is sent)
        run: node scripts/test-contractor-partial-capture.cjs http://localhost:3021
      - name: Server HTML - Spanish pages serve <html lang="es"> and a server-rendered form
        run: node scripts/test-es-server-html.mjs http://localhost:3021
